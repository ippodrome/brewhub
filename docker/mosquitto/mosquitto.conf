listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
# Per-client topic restrictions: without this, any authenticated client
# (including a single device's account) could publish config/OTA commands
# to every other device. See mosquitto/acl and README "MQTT ACLs".
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
