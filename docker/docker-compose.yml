services:
  backend:
    # Pulls the published image by default (built + pushed by
    # .github/workflows/publish-backend-image.yml on every push to main and
    # on version tags) — nothing to compile on the host this runs on. For
    # local development against uncommitted changes, use
    # docker-compose.dev.yml instead, which builds from source.
    image: ghcr.io/ippodrome/brewhub-backend:${BREWHUB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/brewhub.db
      # Point these at whatever MQTT broker you're using — your own existing
      # one, or the bundled one from docker-compose.mosquitto.yml (which also
      # sets MQTT_URL for you). See docker/README section on bring-your-own-broker.
      MQTT_URL: ${MQTT_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Optional — only needed to trigger OTA firmware updates. See README
      # "Firmware / flashing".
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - backend-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:8443"
    # Lets Unraid's Docker tab (or any Docker UI reading standard labels)
    # show a WebUI button/link straight to the app, and group it under a
    # sensible category — works for compose-managed containers exactly the
    # same as it does for XML-template ones; Unraid reads labels off the
    # running container regardless of how it was started.
    labels:
      net.unraid.docker.webui: "https://[IP]:[PORT:8443]/"
      # No icon asset exists yet — omitted rather than pointed at a broken
      # URL. Unraid falls back to a generic Docker icon without one.
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Frontend is built locally (`pnpm --filter @brewhub/frontend build`), not containerized —
      # Caddy just serves the static output. Run the build before `docker compose up`.
      - ../apps/frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
