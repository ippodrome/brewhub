name: Publish backend image

on:
  push:
    branches: [main]
    # Only rebuild when something the backend image actually contains has
    # changed — a frontend-only or docs-only push was rebuilding and
    # republishing an identical image before this. Releases (v* tags) are
    # handled by release.yml.
    paths:
      - "apps/backend/**"
      - "packages/shared-types/**"
      - "docker/backend.Dockerfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-backend-image.yml"

jobs:
  publish:
    name: Build + push ghcr.io/ippodrome/brewhub-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx: without this, build-push-action silently only
      # produces an image for the runner's own architecture (amd64) —
      # fine for Unraid (x86_64-only), but blocks pulling/testing the
      # published image on Apple Silicon or any other arm64 host.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ippodrome/brewhub-backend
          # main builds are "edge" + sha-<short>. Version tags and `latest`
          # come only from release.yml, after tests, so `latest` always
          # means "the newest release" — never an untested main commit.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
