name: Publish backend image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  publish:
    name: Build + push ghcr.io/ippodrome/brewhub-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx: without this, build-push-action silently only
      # produces an image for the runner's own architecture (amd64) —
      # fine for Unraid (x86_64-only), but blocks pulling/testing the
      # published image on Apple Silicon or any other arm64 host.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest + sha-<short> on every push to main, semver tags (1.2.3 / 1.2
      # / 1) when a vX.Y.Z tag is pushed — the same image, multiple names.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ippodrome/brewhub-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
