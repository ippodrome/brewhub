name: Release

# Push a tag like v1.2.0 to publish a release:
#   git tag v1.2.0 && git push origin v1.2.0
#
# 1. the full test suite must pass,
# 2. backend, frontend and updater images are built with the version baked
#    in and pushed to GHCR as :1.2.0 and :latest,
# 3. a GitHub release is created — that's what the in-app updater offers.
# Only GITHUB_TOKEN is used; no long-lived secrets.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  version:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Push ghcr.io/ippodrome/brewhub-${{ matrix.image.name }}
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: backend, file: docker/backend.Dockerfile }
          - { name: frontend, file: docker/frontend.Dockerfile }
          - { name: updater, file: docker/updater.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ippodrome/brewhub-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BREWHUB_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  github-release:
    name: Create GitHub release
    needs: [publish, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Created last, so the updater never sees a release whose images
      # aren't pullable yet. Notes are generated from merged PRs/commits;
      # edit them on GitHub afterwards if you like — the app shows them.
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "BrewHub ${{ needs.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
