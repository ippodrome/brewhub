name: Publish frontend image

on:
  push:
    branches: [main]
    # Mirrors publish-backend-image.yml: only rebuild when something the
    # image actually contains has changed. The Caddyfile is in this list
    # because it is baked into the image now rather than bind-mounted, so
    # editing it has to produce a new image to have any effect.
    paths:
      - "apps/frontend/**"
      - "packages/shared-types/**"
      - "docker/frontend.Dockerfile"
      - "docker/caddy/Caddyfile"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-frontend-image.yml"

jobs:
  publish:
    name: Build + push ghcr.io/ippodrome/brewhub-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Unraid is x86_64-only, so amd64 is what the deployment needs; arm64
      # is here so the published image can also be pulled and checked on
      # Apple Silicon, same reasoning as the backend workflow.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ippodrome/brewhub-frontend
          # main builds are "edge" + sha-<short>. Version tags and `latest`
          # come only from release.yml, after tests, so `latest` always
          # means "the newest release" — never an untested main commit.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Explicit scope: the gha cache backend defaults to a single shared
          # key, so without this the two publish workflows would evict each
          # other's layers on every alternating run.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
