[platformio]
default_envs = gravity-bridge

[env]
build_flags = -std=gnu++17

[env:gravity-bridge]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
; Pinned explicitly for OTA (see firmware/shared/hal-ota) — see fermenter's
; platformio.ini for the full rationale.
board_build.partitions = default.csv
; Only hal-mqtt + hal-ota — no hal-temp/hal-flow/hal-scale/hal-control, this
; board has no control loop and no wired sensors, just BLE scanning + MQTT.
lib_extra_dirs = ../shared/hal-mqtt, ../shared/hal-ota
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.1
