[platformio]
default_envs = kegerator-kegcop

[env]
build_flags = -std=gnu++17

[env:kegerator-kegcop]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
; Pinned explicitly for OTA (see firmware/shared/hal-ota) — see fermenter's
; platformio.ini for the full rationale.
board_build.partitions = default.csv
lib_extra_dirs = ../shared/control, ../shared/hal-control, ../shared/hal-mqtt, ../shared/hal-temp, ../shared/hal-flow, ../shared/hal-ota
lib_deps =
    knolleary/PubSubClient @ ^2.8
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    bblanchon/ArduinoJson @ ^7.0.4
