[platformio]
default_envs = keg-scale

[env]
build_flags = -std=gnu++17

[env:keg-scale]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200
; Pinned explicitly for OTA (see firmware/shared/hal-ota) — see fermenter's
; platformio.ini for the full rationale.
board_build.partitions = default.csv
lib_extra_dirs = ../shared/hal-mqtt, ../shared/hal-scale, ../shared/hal-ota
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    bogde/HX711 @ ^0.7.5
