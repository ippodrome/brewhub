[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17

[env:native]
platform = native
build_flags = -std=gnu++17 -DUNIT_TEST
lib_extra_dirs = ../shared/control, ../shared/display
test_framework = unity

[env:fermenter-brewpi]
platform = espressif32
; Confirmed against thorrak/brewpi-esp's own platformio.ini (its ESP32 TFT/IIC
; environments target `lolin_d32`) — was a placeholder `esp32dev` before this
; was actually checked. Exact GPIO pin routing for OneWire/relay headers on
; the physical "D32 Pro - TFT OneSize" board is in its Eagle .sch schematic
; (thorrak/thorrak_hardware), which isn't text-extractable — pins.h below is
; still a placeholder until that's confirmed against the real board or the
; schematic is opened directly in KiCad/Eagle.
board = lolin_d32
framework = arduino
monitor_speed = 115200
; Pinned explicitly for OTA (see firmware/shared/hal-ota) — this board's 4MB
; flash + lolin_d32 target already defaulted to this scheme implicitly, but
; a future toolchain bump silently changing it would quietly break OTA.
board_build.partitions = default.csv
lib_extra_dirs = ../shared/control, ../shared/hal-control, ../shared/hal-mqtt, ../shared/hal-temp, ../shared/hal-ota, ../shared/display, ../shared/hal-display
lib_deps =
    knolleary/PubSubClient @ ^2.8
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI @ ^2.5.43
; TFT_eSPI is configured entirely through build flags rather than its own
; User_Setup.h. These belong to this environment alone — putting them in the
; shared [env] section pulls TFT_eSPI into the native test build, which has
; no Arduino framework to compile it against.
;
; SMOOTH_FONT is deliberately absent: it makes TFT_eSPI include SPIFFS.h,
; because smooth fonts are loaded from a filesystem at runtime. It does not
; compile here and would need a filesystem partition to buy nothing the
; built-in fonts do not already cover. See ADR-025.
;
; Pin numbers are asserted against include/pins.h at compile time.
build_flags =
    -std=gnu++17
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=14
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000
