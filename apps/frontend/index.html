<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BrewHub</title>
    <!-- Explicit icon: without it the browser requests /favicon.ico, which
         404s (the only console error on every page load). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f8f4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0906" media="(prefers-color-scheme: dark)" />
    <!-- Applies the theme class before first paint, synchronously, so a
         saved "light" preference doesn't flash dark first — ThemeProvider
         (src/theme/ThemeProvider.tsx) owns this same logic afterward for
         all subsequent theme changes; kept in sync deliberately. -->
    <script>
      (function () {
        var stored = localStorage.getItem("brewhub_theme");
        var dark = stored === "light" ? false : stored === "dark" ? true : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
